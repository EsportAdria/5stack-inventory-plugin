name: Inventory candidate images

on:
  push:
    # The fork deploys from main. Upstream's ci workflow (same file) pushes
    # :latest and prunes old package versions, which would delete digests the
    # panel still runs, so the fork keeps this one: one image per commit,
    # tagged by sha, nothing deleted.
    branches:
      - "main"
      - "sync/upstream-main-*"
      - "test/inventory-*"
  workflow_dispatch:

concurrency:
  group: inventory-backend-candidate
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Set registry owner
        id: registry
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the fixed backend
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ steps.registry.outputs.owner }}/5stack-inventory-plugin-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable candidate
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_OWNER: ${{ steps.registry.outputs.owner }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("inventory-backend-image.json").write_text(json.dumps({
              "source": os.environ["GITHUB_SHA"],
              "image": "ghcr.io/" + os.environ["IMAGE_OWNER"] + "/5stack-inventory-plugin-backend@" + os.environ["IMAGE_DIGEST"],
              "platform": "linux/amd64",
              "deployment": "prepared only; do not interrupt active model extraction"
          }, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-backend-image
          path: inventory-backend-image.json
          retention-days: 30

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Set registry owner
        id: registry
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Reuse the Inventory repository's existing public package/access rules.
      # Immutable digest pins and the frontend tag distinguish both components.
      - name: Build the frontend with locked dependencies
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./.github/docker/InventoryFrontend.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ steps.registry.outputs.owner }}/5stack-inventory-plugin-backend:frontend-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Inventory frontend
      - name: Record immutable frontend candidate
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_OWNER: ${{ steps.registry.outputs.owner }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("inventory-frontend-image.json").write_text(json.dumps({
              "source": os.environ["GITHUB_SHA"],
              "image": "ghcr.io/" + os.environ["IMAGE_OWNER"] + "/5stack-inventory-plugin-backend@" + os.environ["IMAGE_DIGEST"],
              "component": "frontend",
              "platform": "linux/amd64",
              "dependencies": "npm ci from committed package-lock.json"
          }, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-frontend-image
          path: inventory-frontend-image.json
          retention-days: 30
